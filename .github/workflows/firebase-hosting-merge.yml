# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # The Firebase web config and EmailJS keys come from repository secrets instead
    # of a committed .env file. Add them under Settings > Secrets and variables > Actions.
    env:
      REACT_APP_FIREBASE_API_KEY: '${{ secrets.REACT_APP_FIREBASE_API_KEY }}'
      REACT_APP_FIREBASE_AUTH_DOMAIN: '${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}'
      REACT_APP_FIREBASE_DATABASE_URL: '${{ secrets.REACT_APP_FIREBASE_DATABASE_URL }}'
      REACT_APP_FIREBASE_PROJECT_ID: '${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}'
      REACT_APP_FIREBASE_STORAGE_BUCKET: '${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}'
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: '${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}'
      REACT_APP_FIREBASE_APP_ID: '${{ secrets.REACT_APP_FIREBASE_APP_ID }}'
      REACT_APP_FIREBASE_MEASUREMENT_ID: '${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}'
      REACT_APP_EMAILJS_SERVICE_ID: '${{ secrets.REACT_APP_EMAILJS_SERVICE_ID }}'
      REACT_APP_EMAILJS_TEMPLATE_ID: '${{ secrets.REACT_APP_EMAILJS_TEMPLATE_ID }}'
      REACT_APP_EMAILJS_PUBLIC_KEY: '${{ secrets.REACT_APP_EMAILJS_PUBLIC_KEY }}'
    steps:
      - uses: actions/checkout@v4
      - name: Check build secrets
        run: |
          missing=0
          for name in REACT_APP_FIREBASE_API_KEY REACT_APP_FIREBASE_AUTH_DOMAIN \
            REACT_APP_FIREBASE_DATABASE_URL REACT_APP_FIREBASE_PROJECT_ID \
            REACT_APP_FIREBASE_STORAGE_BUCKET REACT_APP_FIREBASE_MESSAGING_SENDER_ID \
            REACT_APP_FIREBASE_APP_ID REACT_APP_FIREBASE_MEASUREMENT_ID \
            REACT_APP_EMAILJS_SERVICE_ID REACT_APP_EMAILJS_TEMPLATE_ID REACT_APP_EMAILJS_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIROSHKAVINDA }}'
          channelId: live
          projectId: miroshkavinda
